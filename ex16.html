<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = 1;    

        for( let i = 1 ; i <= 5 ; i++){
            if( i == 3 ){
                continue;
                console.log(3333)
                //break;
            }
            console.log( i )
        }

        //위에 컨티뉴는 일치하는 반복문의 위쪽으로 바로 올려보내서 로그 실행안되고 그다음 연산부터 함
        //위에 브레이크는 반복문을 빠져나올때 사용함

        // if 문 단독으론 break 쓰지 않음. for나 switch로 감싸져 있을 때 사용 가능

        for( ; ; ){
                if(num == 1){
                    console.log(1111)
                    break;
                }
        }
        switch( num ){
            case 1 :
                if(num == 1){
                    console.log(1111)
                    break;
        }
    }
    </script>
</head>

</body>
</html>
