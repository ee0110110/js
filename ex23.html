<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myClick(){
            const result = confirm("처음방문?")
            console.log(result)
            if(result){//참인 경우
                document.getElementById("txt").innerHTML = "처음"
            }else{
                document.getElementById("txt").innerHTML = "새 방문"
            }
        }
            const myClick2 = () => {
                //window.open();
                //window.open("https://www.naver.com","_self");
                //window.open("https://www.naver.com","","width=500, height=500");
                window.open("ex23_popup.html","","width=500, height=500");
            }
            const test = () =>{
                //alert("test")
                const fo =document.getElementById("fo")
                console.log(fo)
                console.log(fo.txt) // 서브밋하면 폼태그의 액션으로 이동함, 폼태그로 입력해두면 유효성 검사를 이프 조건문으로 할 수 있음, 기존은 밑의 두줄임
                //const txt = document.getElementById("txt")
                //txt.value == ""
                if(fo.txt.value == ""){
                    alert("값 입력")
                }else{
                    fo.submit();
                }
            }
            function test2(){
                location.href="ex20.html" //해당 태그를 온클릭에 넣을 수도 있음 // 버튼 두개랑 a 태그랑 동일한 결과임
            }

            function init(){
                const t01 = document.getElementById("t01")
                const t02 = document.getElementById("t02")
                t01.addEventListener("click", btn_listener) //클릭이 일어나면 밑에 btn_listener 함수 실행함
                t02.addEventListener("click", (event) => {
                    btn_listener(event) }) //클릭이 일어나면 alert 함수 실행함 btn_listener 넣으면 그거 실행함
            }
            function btn_listener(event){
                console.log( event.target.id )
                switch(event.addEventListener){
                case "t01" : alert(111); break;
                case "t02" : alert(222); break;
            }}

            function test03(value){
                console.log(value)
                const div = document.getElementById("remove");
                switch(value.id){
                    case "show" : 
                        div.setAttribute("class","a")
                        break;
                    case "hidd" : 
                        div.removeAttribute("class")
                        break;
                }
            }
    </script>
    <style>
        #remove{display: none;}
        #remove.a {display: block; background-color:green;}    
    </style>
</head>
<body onload="init()">
    
    <button onclick="test03(this)" id="show">보이기</button>
    <div id="remove" class="a" class="a">
        <h3>안녕</h3>    
        <button onclick="test03(this)" id="hidd">숨기기</button>
    </div>

    <button type="button" id="t01">btn01</button>
    <button type="button" id="t02">btn02</button>
    <hr>
    <button onclick="test2()">이동1</button>
    <button onclick=" location.href = 'ex20.html' ">이동2</button>
    <a href="ex20.html">ex20이동</a>

    <form id="fo" action="ex22.html">
        <input type="text" id="txt">
        <input type="button" onlcick="test()">      
    </form>

    <button onclick="myClick2()">open</button>

    <div id="txt"></div>
    <button onclick="myClick()">cl</button>
</body>
</html>
