<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        const test1 =() =>{
        const num = 100;
        console.log(num);

        const num1 = ["100", 100, "값", 1.111];
            //인덱스     0      1     2     3
        console.log( num1 )
        num1[0] = "다른 값" // 값 변경시 변경한 값이 출력됨
        console.log( num1[0] )
        console.log( num1[3] )
        console.log( num1.length )
        console.log( num1 )

        for(let i = 0 ; i < num1.length ; i++)
            //console.log("i : ", i)
            console.log(`num1${i} : ${num[i]}`)}

        const test2 = () => {
            const arr = ["내용1", "내용2", "내용3"]
            const str1 = arr.join();
            console.log("배열 type : ", typeof arr);
            console.log("배열 : ", arr);
            console.log("str1 type : ", typeof str1);
            console.log("str1 : ", str1);
            // ["내용1", "내용2", "내용3"]
            console.log("배열[0] : ", arr[0]);
            // "내용1", "내용2", "내용3"
            console.log("str1[0] : ", str1[2]);

            const str2=arr.join("-")
            console.log("str2 : ", str2);
        }

        const test3 = () => {
            let arr = [111, 222, 333] // arr.length = 3
            console.log(`기본배열: ${arr}`)
            arr[arr.length] = "값 추가" //인덱스 3에 지정하면 값 추가 됨, 마지막일땐 그냥 arr랭스 씀
            console.log(`기본배열 : ${arr}`)

            arr.push("값1", "값2") // 마지막에 추가함
            console.log(`push : ${arr}`)
        
            arr.pop() // 배열의 가장 마지막 값을 삭제함
            console.log(`pop : ${arr}`)

            arr.unshift("v1", "v2") // 앞으로 값을 추가함
            console.log(`unshift : ${arr}`)

            arr.shift() // 맨 앞 값 하나 삭제함
            console.log(`shift : ${arr}` )

            const arr2 = ["aaa", "bbb"] 
            const result = arr.concat(arr2) // 마지막에 추가함 concat과 push 랑 비슷, 출력값은 동일함
            console.log(result) // concat은 배열에 요소를 붙여서 추가함
            // arr  = v2,111,222,333,값 추가,값1,aaa,bbb
            
            arr.push(arr2) // push는 원래 있던 배열에 새로운 배열을 추가함
            console.log(`${arr}`)
            // arr  = v2,111,222,333,값 추가,값1,["aaa","bbb"]
        }

        const test4 = () => {
            const arr = [111,222,333]
            arr.forEach(printArr) // forEach는 순차적으로 출력함
            /* 동일한데 다른 표현
            for(let i=0; i <arr.length ; i++){
                console.log( i, arr[i] )
            } */
           arr.forEach(         
            function printArr(item, index){
            console.log(`데이터 ${index} : ${item}` )
        } )

        arr.forEach(         
            (item, index) => {
            console.log(`데이터 ${index} : ${item}` )
        } )    }
        //변 = () => {} , forEach는 반복, 리턴을 쓸 수 없음 / 맵으로 리턴 가능

        function printArr(item, index){
            console.log(`데이터 ${index} : ${item}` )
        }
        const test5 =()=> {
            const arr = [111,222,333]
            const newArr = arr.map(mapTest)
            console.log (newArr)

            const newArr2 = arr.map(
                ( v ) => {
                    return v * 100;
                }
            );
            console.log( newArr2 )

            const newArr3 = arr.map( ( v ) => v*100);
            console.log( newArr3 )
        }
        function mapTest(value){
            return value*10;
        }
    </script>
</head>

</body>
</html>
